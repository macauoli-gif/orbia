<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pauta de Estudos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: cabeçalho fixo com abas, painel de avisos no topo e uma área de trabalho por aba (quadro, cronograma, resumos). */
:root {
  --bg: #f3f6f8;
  --surface: #ffffff;
  --ink: #14232e;
  --muted: #5c6f7c;
  --line: #d9e2e8;
  --accent: #0b6e8a;
  --accent-ink: #ffffff;
  --crit: #c4321f;
  --warn: #b9700a;
  --ok: #1f7a4d;
  --crit-bg: #fbe9e6;
  --warn-bg: #fdf1dc;
  --ok-bg: #e3f3ea;
  --chip-l: 30%;
  --shadow: 0 1px 2px rgba(20,35,46,.08), 0 4px 14px rgba(20,35,46,.06);
  --display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
  --body: "DM Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1a22; --surface: #17252f; --ink: #e8f0f4; --muted: #93a8b5; --line: #29404e;
    --accent: #4cc0de; --accent-ink: #062631;
    --crit: #ff8c7a; --warn: #f0b95a; --ok: #6fd3a0;
    --crit-bg: #3a1f1c; --warn-bg: #38290f; --ok-bg: #16352a;
    --chip-l: 76%; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1a22; --surface: #17252f; --ink: #e8f0f4; --muted: #93a8b5; --line: #29404e;
  --accent: #4cc0de; --accent-ink: #062631;
  --crit: #ff8c7a; --warn: #f0b95a; --ok: #6fd3a0;
  --crit-bg: #3a1f1c; --warn-bg: #38290f; --ok-bg: #16352a;
  --chip-l: 76%; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--body); }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px 48px; }

header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 18px 0 12px; }
header.top h1 { font-size: 26px; letter-spacing: -.01em; }
header.top .date { color: var(--muted); font-size: 14px; }
.top-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn.danger { color: var(--crit); border-color: var(--crit); background: transparent; }
.btn.small { padding: 4px 9px; font-size: 13px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }

nav.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
nav.tabs button { border: 0; background: none; padding: 10px 16px; font-weight: 700; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs .count { font-weight: 500; color: var(--muted); margin-left: 4px; font-size: 13px; }

/* Avisos */
.alerts { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 18px; box-shadow: var(--shadow); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { border-radius: 10px; padding: 10px 12px; background: var(--bg); border-left: 5px solid var(--line); }
.tile b { display: block; font: 700 26px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.tile span { font-size: 13px; color: var(--muted); }
.tile.crit { border-left-color: var(--crit); background: var(--crit-bg); }
.tile.warn { border-left-color: var(--warn); background: var(--warn-bg); }
.tile.ok { border-left-color: var(--ok); background: var(--ok-bg); }
.alert-list { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 6px; }
.alert-item { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; border-left: 4px solid var(--line); background: var(--bg); width: 100%; text-align: left; border-top: 0; border-right: 0; border-bottom: 0; }
.alert-item.crit { border-left-color: var(--crit); }
.alert-item.warn { border-left-color: var(--warn); }
.alert-item.info { border-left-color: var(--accent); }
.alert-item .tag { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; min-width: 82px; }
.alert-item.crit .tag { color: var(--crit); }
.alert-item.warn .tag { color: var(--warn); }
.alert-item.info .tag { color: var(--accent); }
.alerts .more { margin-top: 8px; }
.empty-alert { margin: 12px 0 0; color: var(--ok); font-weight: 500; }

/* Quadro */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.toolbar h2 { font-size: 20px; margin-right: auto; }
.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
.col { background: color-mix(in srgb, var(--line) 35%, transparent); border-radius: 12px; padding: 10px; min-height: 140px; }
.col.over { outline: 2px dashed var(--accent); }
.col-head { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 10px; }
.col-head h3 { font-size: 16px; }
.col-head .n { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
.cards { display: grid; gap: 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; box-shadow: var(--shadow); border-left: 5px solid var(--line); }
.card.crit { border-left-color: var(--crit); }
.card.warn { border-left-color: var(--warn); }
.card.done { opacity: .75; border-left-color: var(--ok); }
.card[draggable="true"] { cursor: grab; }
.card .title { font-weight: 700; margin: 4px 0; overflow-wrap: anywhere; }
.card.done .title { text-decoration: line-through; }
.card .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.card .actions { display: flex; gap: 6px; margin-top: 8px; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 700; background: hsl(var(--h, 200) 70% 50% / .16); color: hsl(var(--h, 200) 60% var(--chip-l)); }
.pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 700; }
.pill.crit { background: var(--crit-bg); color: var(--crit); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.plain { background: var(--bg); color: var(--muted); }
.empty { color: var(--muted); font-size: 14px; padding: 14px 6px; text-align: center; }

/* Cronograma */
.week { display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); gap: 10px; align-items: start; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; box-shadow: var(--shadow); }
.day.today { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent); }
.day-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.day-head h3 { font-size: 16px; }
.day-head .hoje { font-size: 11px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .05em; }
.blocks { display: grid; gap: 8px; }
.block { border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--bg); border-left: 5px solid hsl(var(--h, 200) 60% 50%); }
.block.now { background: var(--ok-bg); }
.block.missed { background: var(--warn-bg); }
.block .time { font: 700 14px var(--body); font-variant-numeric: tabular-nums; }
.block .what { font-size: 14px; overflow-wrap: anywhere; margin: 2px 0 4px; }
.block .link { font-size: 12px; color: var(--muted); }
.block label { display: flex; gap: 6px; align-items: center; font-size: 13px; margin-top: 6px; }
.block .edit { margin-top: 6px; }

/* Resumos */
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.filters input, .filters select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.filters input[type="search"] { width: 300px; max-width: 100%; flex: 1 1 220px; }
.sums { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.sum { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; }
.sum h3 { font-size: 17px; overflow-wrap: anywhere; }
.sum .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.sum .text { white-space: pre-wrap; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; max-width: 65ch; }
.sum.open .text { display: block; }
.sum .actions { display: flex; gap: 6px; margin-top: auto; flex-wrap: wrap; }

/* Janela */
.overlay { position: fixed; inset: 0; background: rgba(8,16,22,.55); display: flex; align-items: flex-start; justify-content: center; padding: 24px 12px; overflow-y: auto; z-index: 20; }
.modal { background: var(--surface); border-radius: 14px; width: 100%; max-width: 520px; padding: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.modal h2 { font-size: 20px; margin-bottom: 12px; }
.form { display: grid; gap: 12px; }
.form .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form label { display: grid; gap: 4px; font-size: 13px; font-weight: 700; color: var(--muted); }
.form input, .form select, .form textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 9px 10px; font-weight: 400; color: var(--ink); width: 100%; min-width: 0; }
.form textarea { min-height: 150px; resize: vertical; }
.form .check { display: flex; align-items: center; gap: 8px; font-weight: 500; color: var(--ink); }
.form .check input { width: auto; }
.form .err { color: var(--crit); font-size: 13px; min-height: 18px; }
.modal-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.modal-actions .spacer { margin-left: auto; }
.hint { color: var(--muted); font-size: 13px; }

/* Banco de resumos */
.lib { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 18px; align-items: start; }
.shelves { display: grid; gap: 3px; position: sticky; top: 8px; max-height: calc(100vh - 24px); overflow-y: auto; }
.shelf { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid transparent; border-radius: 8px; background: none; text-align: left; }
.shelf:hover { background: var(--surface); }
.shelf.on { background: var(--surface); border-color: var(--accent); font-weight: 700; }
.shelf .dot { width: 10px; height: 10px; border-radius: 50%; background: hsl(var(--h, 200) 60% 50%); flex: none; }
.shelf .nm { flex: 1; min-width: 0; font-size: 14px; }
.shelf .ct { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 8px 12px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.grp { font-size: 18px; margin: 20px 0 10px; display: flex; gap: 8px; align-items: baseline; }
.grp .ct { font: 400 13px var(--body); color: var(--muted); }
.sum .read { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; margin-left: auto; }

/* Questões, simulados, desempenho e foco */
.qfilters { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 12px; }
.fl { display: grid; gap: 4px; font-size: 13px; font-weight: 700; color: var(--muted); min-width: 0; }
.fl select, .fl input { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; font-weight: 400; color: var(--ink); width: 100%; min-width: 0; }
.qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; margin-top: 12px; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; }
.qcard .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.qcard .qstem { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.qcard .actions { display: flex; gap: 6px; margin-top: auto; flex-wrap: wrap; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px; }
.panel h3 { font-size: 18px; margin-bottom: 10px; }
.panel h4 { font: 700 15px var(--display); margin: 0; }
.panel.hi { border-color: var(--accent); }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; align-items: start; }
.two > .panel { margin-bottom: 0; }
.ph { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.ph .actions { display: flex; flex-wrap: wrap; gap: 6px; }
.up { color: var(--ok); font-weight: 700; }
.down { color: var(--crit); font-weight: 700; }
.qview .q-stem { font-size: clamp(17px, 2.4vw, 21px); line-height: 1.5; margin: 6px 0; max-width: 70ch; overflow-wrap: anywhere; }
.opts { display: grid; gap: 10px; }
.opt { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 16px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .ltr { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--bg); border: 1px solid var(--line); }
.opt .otxt { overflow-wrap: anywhere; padding-top: 3px; }
.opt.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
.opt.sel .ltr { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.opt.right { border-color: var(--ok); background: var(--ok-bg); color: var(--ink); }
.opt.wrong { border-color: var(--crit); background: var(--crit-bg); color: var(--ink); }
.opt.dim { opacity: .7; }
.opt:disabled { cursor: default; color: var(--ink); }
.banner { padding: 12px 14px; border-radius: 10px; font-weight: 700; border-left: 5px solid var(--line); }
.banner.good { background: var(--ok-bg); border-left-color: var(--ok); color: var(--ok); }
.banner.bad { background: var(--crit-bg); border-left-color: var(--crit); color: var(--crit); }
.banner.warn { background: var(--warn-bg); border-left-color: var(--warn); color: var(--warn); }
.expl { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.expl h3 { font-size: 16px; margin-bottom: 6px; }
.expl p { margin: 0; overflow-wrap: anywhere; }
.whylist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.whylist li { padding: 8px 10px; border-radius: 8px; background: var(--bg); overflow-wrap: anywhere; }
.whylist li.right { background: var(--ok-bg); }
.arena.top { z-index: 40; }
.modes { display: grid; gap: 10px; margin: 6px 0; }
.modeset { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; }
.modeset legend { font-size: 13px; font-weight: 700; color: var(--muted); padding: 0 6px; }
.check { display: flex; align-items: center; gap: 8px; }
.simlist { display: grid; gap: 10px; }
.simrow { display: grid; grid-template-columns: 1fr auto auto; gap: 14px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.simrow .meta { display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px; color: var(--muted); margin-top: 2px; }
.simscore { text-align: center; }
.simscore b { display: block; font: 700 24px var(--display); font-variant-numeric: tabular-nums; }
.qnav { display: flex; flex-wrap: wrap; gap: 6px; }
.qn { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-variant-numeric: tabular-nums; }
.qn.ans { background: color-mix(in srgb, var(--accent) 14%, var(--surface)); border-color: var(--accent); }
.qn.mk { box-shadow: inset 0 -4px 0 var(--warn); }
.qn.cur { outline: 2px solid var(--ink); outline-offset: 1px; }
#run-timer.low { color: var(--crit); }
.corr { display: grid; gap: 8px; }
.corrrow { display: grid; grid-template-columns: 28px auto 1fr auto; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.corrrow .num { font-weight: 700; font-variant-numeric: tabular-nums; }
.corrrow .hint { grid-column: 3 / 4; }
.corrrow .cs { overflow-wrap: anywhere; }
.hbars { display: grid; gap: 8px; }
.hbar { display: grid; grid-template-columns: minmax(90px, 160px) 1fr minmax(70px, auto); gap: 10px; align-items: center; font-size: 14px; }
.hbar .nm { overflow-wrap: anywhere; }
.hbar .track { height: 12px; background: var(--bg); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.hbar .track i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.hbar .val { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; font-size: 13px; }
.lc { width: 100%; height: auto; max-height: 260px; }
.lc-grid { stroke: var(--line); stroke-width: 1; }
.lc-line { stroke: var(--accent); fill: none; stroke-width: 3; stroke-linejoin: round; }
.lc-dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.lc-t { fill: var(--muted); font: 12px var(--body); }
.lc-v { fill: var(--ink); font: 700 12px var(--body); }
.tablewrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th, .tbl td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.tbl th { color: var(--muted); font-size: 13px; }
.prio { list-style: none; margin: 0 0 8px; padding: 0; display: grid; gap: 12px; }
.prio > li { border: 1px solid var(--line); border-left: 5px solid var(--accent); border-radius: 10px; padding: 12px; background: var(--bg); }
.prio .ph { justify-content: flex-start; flex-wrap: nowrap; align-items: flex-start; }
.prio .rk { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; }
.prio ul { margin: 8px 0 8px 42px; padding-left: 18px; }
.prio .actions { margin-left: 42px; display: flex; gap: 6px; flex-wrap: wrap; }
.pomo { text-align: center; }
.pomo-time, .fo-time { font: 700 clamp(64px, 14vw, 120px)/1 var(--display); font-variant-numeric: tabular-nums; margin: 10px 0 16px; }
.focusmode { background: var(--bg); display: grid; place-items: center; }
.fo { text-align: center; display: grid; gap: 14px; }
.fo-time { font-size: clamp(90px, 22vw, 220px); }
.panel.grp h4 { margin-top: 4px; }
@media (max-width: 760px) {
  .simrow { grid-template-columns: 1fr; }
  .corrrow { grid-template-columns: 24px auto 1fr; }
  .corrrow button { grid-column: 1 / -1; justify-self: start; }
  .hbar { grid-template-columns: 1fr; gap: 2px; }
  .hbar .val { text-align: left; }
  .two { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .opt { transition: none; } }

/* Flashcards */
.fc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.fc { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; border-left: 5px solid hsl(var(--h, 200) 60% 50%); }
.fc .q { font-weight: 700; overflow-wrap: anywhere; }
.fc .a { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.fc .score { font-size: 13px; color: var(--muted); display: flex; gap: 10px; align-items: center; margin-top: auto; }
.study { max-width: 640px; margin: 0 auto; display: grid; gap: 14px; }
.study .toolbar { margin-bottom: 0; }
.progress { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); }
.flash { width: 100%; min-height: 240px; border: 1px solid var(--line); border-left: 6px solid hsl(var(--h, 200) 60% 50%); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); padding: 24px; font: 700 22px/1.35 var(--display); text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
.flash.back { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.flash small { font: 700 12px var(--body); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.flash .txt { white-space: pre-wrap; overflow-wrap: anywhere; }
.flash .tap { font: 400 13px var(--body); color: var(--muted); }
.study-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.btn.good { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); font-weight: 700; }
.btn.bad { background: var(--crit-bg); color: var(--crit); border-color: var(--crit); font-weight: 700; }
.btn.big { padding: 12px 22px; font-size: 16px; }
.result { text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 28px 18px; box-shadow: var(--shadow); }
.result b { font: 700 40px var(--display); display: block; font-variant-numeric: tabular-nums; }

/* Jogo de flashcards */
.arena { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto; padding: 14px 16px 24px; }
.arena-in { max-width: 940px; margin: 0 auto; display: grid; gap: 12px; }
.hud { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; min-width: 88px; }
.stat b { display: block; font: 700 22px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.hud .grow { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.scene { perspective: 1600px; }
.flip3d { position: relative; display: block; width: 100%; height: min(62vh, 560px); min-height: 300px; padding: 0; border: 0; background: none; cursor: pointer; transform-style: preserve-3d; transition: transform .55s cubic-bezier(.3,.7,.2,1); }
.flip3d.flipped { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; -webkit-backface-visibility: hidden; backface-visibility: hidden; border-radius: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 28px; text-align: center; border: 1px solid var(--line); border-top: 8px solid hsl(var(--h, 200) 60% 50%); box-shadow: var(--shadow); overflow: auto; }
.face.front { background: var(--surface); }
.face.back { background: color-mix(in srgb, var(--accent) 14%, var(--surface)); transform: rotateY(180deg); }
.face small { font: 700 13px var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.face .txt { font: 700 clamp(22px, 4.2vw, 40px)/1.3 var(--display); white-space: pre-wrap; overflow-wrap: anywhere; max-width: 24em; }
.face.back .txt { font-weight: 600; font-size: clamp(20px, 3.6vw, 34px); }
.face .tap { font: 400 14px var(--body); color: var(--muted); }
.flip3d.hit .face { outline: 5px solid var(--ok); outline-offset: -5px; }
.flip3d.miss .face { outline: 5px solid var(--crit); outline-offset: -5px; }
.arena-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; min-height: 52px; }
.arena-actions .btn { min-width: 150px; }
.stars { font-size: 44px; letter-spacing: 6px; color: var(--warn); }
.stars .off { color: var(--line); }
.result .row2 { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 14px 0; }
@media (prefers-reduced-motion: reduce) { .flip3d { transition: none; } }

@media (max-width: 760px) {
  .lib { grid-template-columns: 1fr; }
  .shelves { position: static; grid-auto-flow: column; grid-auto-columns: max-content; overflow-x: auto; max-height: none; padding-bottom: 6px; }
  .shelf { border-color: var(--line); background: var(--surface); }
  .board { grid-template-columns: 1fr; }
  header.top h1 { font-size: 22px; }
  .form .row { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: no-preference) {
  .card, .sum, .btn { transition: border-color .15s, box-shadow .15s; }
}

/* Perfil por série, metas, provas anteriores e cartão-resposta */
.perfil { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; color: var(--muted); margin-top: 4px; }
.perfil b { color: var(--ink); }
.metas { margin-top: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); }
.metas h3 { font-size: 15px; margin: 0 0 6px; }
.mrow { display: grid; grid-template-columns: minmax(140px, 230px) 1fr auto; gap: 10px; align-items: center; margin: 4px 0; font-size: 14px; }
.meter { height: 10px; border-radius: 99px; background: var(--bg); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.meter.ok i { background: var(--ok); }
.mnote { font-size: 13px; margin: 6px 0 0; padding: 6px 10px; border-radius: 8px; background: var(--warn-bg); }
.mnote.info { background: var(--bg); color: var(--muted); }
.login { max-width: 640px; margin-top: 4vh; }
.login h2 { font-size: 28px; margin: 0; }
.series { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
.series legend { font-weight: 700; margin-bottom: 6px; padding: 0; }
.scard { display: flex; gap: 10px; align-items: flex-start; border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface); cursor: pointer; }
.scard:has(input:checked) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, var(--surface)); }
.scard b { display: block; }
.scard span { display: block; font-size: 13px; color: var(--muted); }
.exams { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.exam { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; align-content: start; }
.exam h4 { margin: 0; font-size: 16px; }
.exam p { margin: 0; font-size: 13px; color: var(--muted); }
a.btn { display: inline-block; text-decoration: none; text-align: center; }
.pgrp { margin: 16px 0 4px; font: 700 16px var(--display); }
.prow { display: flex; gap: 10px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--line); }
.prow .num { min-width: 34px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.plets { display: flex; gap: 6px; }
.plet { width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); font-weight: 700; font-size: 15px; }
.plet.sel { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pmk { margin-left: auto; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
.pmk.on { background: var(--warn-bg); border-color: var(--warn); color: var(--warn); font-weight: 700; }
.cells { display: flex; flex-wrap: wrap; gap: 6px; }
.cell { width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; font-weight: 700; font-size: 13px; border: 1px solid var(--line); background: var(--bg); }
.cell.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.cell.err { background: var(--crit-bg); border-color: var(--crit); color: var(--crit); }
.cell.anul { opacity: .55; text-decoration: line-through; }
.serietoggle { margin: 4px 0 10px; }
@media (max-width: 560px) { .mrow { grid-template-columns: 1fr; gap: 4px; } #sim-root .panel { padding: 8px 10px; } .prow { gap: 6px; } .prow .num { min-width: 28px; } .plets { gap: 4px; } .plet { width: 40px; height: 40px; font-size: 14px; } .pmk { padding: 6px; font-size: 12px; } }

.form .scard { display: flex; font-size: 16px; font-weight: 400; color: var(--ink); }
.form .scard input { width: auto; margin-top: 4px; }
a.btn { color: var(--ink); } a.btn.primary { color: var(--accent-ink); }
#view > .panel > label { display: grid; gap: 4px; font-size: 13px; font-weight: 700; color: var(--muted); margin-top: 10px; }
#view > .panel > label input, #view > .panel > label textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 9px 10px; font-weight: 400; color: var(--ink); width: 100%; }

.scratch { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 6px 12px 10px; margin: 12px 0; }
.scratch summary { cursor: pointer; font-weight: 700; padding: 8px 0; }
.scr-tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0 8px; }
.scr-tools select { padding: 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
.scr-tools .check { display: flex; gap: 6px; align-items: center; font-size: 13px; }
.scr-cv { display: block; width: 100%; touch-action: none; border: 1px dashed var(--line); border-radius: 8px; color: var(--ink); cursor: crosshair; background-color: var(--bg); background-image: linear-gradient(var(--line) 1px, transparent 1px); background-size: 100% 32px; }
</style>
</head>

<script>
(function () {
  var KEY = "pauta-estudos-v1";
  var DAYS = ["Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado", "Domingo"];
  var STATUS = [["todo", "A fazer"], ["doing", "Em andamento"], ["done", "Concluído"]];
  var PRIO = { alta: "Alta", media: "Média", baixa: "Baixa" };
  var state, tab = "quadro", showAllAlerts = false;
  var sumFilter = { q: "", subject: "", origin: "all", open: {}, copied: {} };
  var cardFilter = "", study = null;
  var SUBJECTS = ["Artes", "Biologia", "Educação física", "Filosofia", "Física", "Geografia", "História", "Interioridade e projeto de vida", "Itinerário de ciências da natureza", "Itinerário de ciências humanas", "Itinerário de ciências exatas", "Itinerário de linguagens", "Língua inglesa", "Língua portuguesa", "Literatura", "Matemática", "Produção de texto", "Química", "Sociologia"];

  /* Banco de resumos do app: texto de apoio, curto e geral. Conferir sempre com o caderno e com o professor. */
  var TPL = function (nome) { return "Modelo para montar o seu resumo de " + nome + ".\n\nTema da aula:\n• \n\nIdeias principais (3 a 5):\n• \n• \n• \n\nPalavras-chave e definições:\n• \n\nExemplo ou exercício que fixou o conteúdo:\n• \n\nDúvidas para levar ao professor:\n• "; };
  var BANK = [
    { id: "b-art-1", subject: "Artes", title: "Movimentos artísticos em linha do tempo", text: "• Renascimento (séculos XIV a XVI): volta aos valores da Antiguidade, perspectiva, proporção e realismo. Leonardo da Vinci e Michelangelo.\n• Barroco (séculos XVII e XVIII): contraste entre luz e sombra, emoção e dramaticidade.\n• Impressionismo (final do século XIX): pintar a impressão da luz e da cor em cada momento. Claude Monet.\n• Cubismo (início do século XX): objetos mostrados por vários ângulos ao mesmo tempo, com formas geométricas. Pablo Picasso e Georges Braque.\n• Surrealismo (século XX): sonho e inconsciente como fonte de criação. Salvador Dalí.\n• Modernismo brasileiro: marcado pela Semana de Arte Moderna de 1922. Tarsila do Amaral e Anita Malfatti." },
    { id: "b-bio-1", subject: "Biologia", title: "Células e organelas", text: "• Procariontes: sem núcleo definido (bactérias). Eucariontes: com núcleo delimitado (animais, plantas, fungos, protistas).\n• Núcleo: guarda o DNA.\n• Mitocôndria: respiração celular e produção de ATP.\n• Ribossomos: produção de proteínas.\n• Retículo endoplasmático: transporte e síntese de substâncias. Complexo golgiense: modifica e empacota substâncias.\n• Lisossomos: digestão intracelular.\n• Cloroplastos (só em plantas e algas): fotossíntese.\n• Membrana plasmática: controla o que entra e sai da célula." },
    { id: "b-bio-2", subject: "Biologia", title: "Genética mendeliana", text: "• 1ª lei de Mendel (segregação): cada característica é determinada por dois alelos, que se separam na formação dos gametas.\n• 2ª lei (segregação independente): genes de características diferentes, em cromossomos diferentes, se separam de forma independente.\n• Dominante: aparece mesmo em heterozigoto (Aa). Recessivo: só aparece em homozigoto (aa).\n• Cruzamento Aa × Aa: proporção genotípica 1 AA : 2 Aa : 1 aa e proporção fenotípica 3 dominante : 1 recessivo." },
    { id: "b-edf-1", subject: "Educação física", title: "Capacidades físicas e cuidados com o treino", text: "• Capacidades físicas: força, resistência, velocidade, flexibilidade, agilidade, equilíbrio e coordenação.\n• Cultura corporal do movimento: jogos, esportes, ginásticas, danças, lutas e práticas de aventura.\n• Antes da atividade: aquecimento. Depois: alongamento e volta à calma.\n• Cuidados: hidratação, roupa e calçado adequados, respeitar os limites do corpo e procurar orientação quando houver dor." },
    { id: "b-fil-1", subject: "Filosofia", title: "Da Grécia antiga à modernidade", text: "• Pré-socráticos: buscavam o princípio de todas as coisas (arché). Para Tales de Mileto, a água.\n• Sócrates: método do diálogo, com ironia e maiêutica, para levar o interlocutor a pensar por conta própria.\n• Platão: mundo das ideias e mundo sensível. Alegoria da caverna.\n• Aristóteles: lógica, ética, política e estudo da natureza. O ser humano é um animal político.\n• Descartes (racionalismo): «penso, logo existo». Empiristas, como Locke e Hume, defendem que o conhecimento vem da experiência." },
    { id: "b-fis-1", subject: "Física", title: "Cinemática: MRU e MRUV", text: "• Velocidade média: v = Δs / Δt.\n• MRU (velocidade constante): s = s₀ + v·t.\n• MRUV (aceleração constante): v = v₀ + a·t.\n• s = s₀ + v₀·t + (a·t²)/2.\n• Equação de Torricelli: v² = v₀² + 2·a·Δs.\n• Cuidado com as unidades: converter km/h em m/s dividindo por 3,6." },
    { id: "b-fis-2", subject: "Física", title: "Leis de Newton", text: "• 1ª lei (inércia): sem força resultante, o corpo fica em repouso ou em MRU.\n• 2ª lei: F = m · a (força em newtons, massa em kg, aceleração em m/s²).\n• 3ª lei (ação e reação): as forças têm mesmo módulo e sentidos opostos, mas atuam em corpos diferentes.\n• Peso: P = m · g, com g ≈ 9,8 m/s² (em muitos exercícios se usa 10).\n• Massa é a quantidade de matéria e não muda. Peso é uma força e depende da gravidade." },
    { id: "b-fis-3", subject: "Física", title: "Eletricidade básica", text: "• 1ª lei de Ohm: U = R · i.\n• Potência elétrica: P = U · i. Energia: E = P · Δt.\n• Resistores em série: Req = R₁ + R₂, com a mesma corrente em todos.\n• Resistores em paralelo: 1/Req = 1/R₁ + 1/R₂, com a mesma tensão em todos.\n• Unidades: tensão em volts (V), corrente em ampères (A), resistência em ohms (Ω), potência em watts (W)." },
    { id: "b-geo-1", subject: "Geografia", title: "Biomas e clima do Brasil", text: "• Seis biomas continentais: Amazônia, Cerrado, Mata Atlântica, Caatinga, Pampa e Pantanal.\n• Fatores que influenciam o clima: latitude, altitude, massas de ar, continentalidade e correntes marítimas.\n• Amazônia: floresta densa, clima equatorial quente e úmido. Caatinga: clima semiárido e vegetação adaptada à seca.\n• Cerrado: savana brasileira, com chuva concentrada em uma estação.\n• Os biomas sofrem pressão de desmatamento, queimadas e expansão agropecuária." },
    { id: "b-geo-2", subject: "Geografia", title: "Urbanização brasileira", text: "• A urbanização foi acelerada a partir da segunda metade do século XX, com forte êxodo rural ligado à industrialização.\n• O Censo de 1970 foi o primeiro a mostrar mais gente nas cidades do que no campo.\n• Consequências: crescimento de metrópoles, periferias, favelas, trânsito e déficit de moradia e saneamento.\n• Conceitos: metrópole, conurbação, região metropolitana e segregação socioespacial." },
    { id: "b-his-1", subject: "História", title: "Revolução Industrial", text: "• Começou na Inglaterra, na segunda metade do século XVIII.\n• Fatores: acúmulo de capital, carvão e ferro, mercado consumidor, mão de obra livre após os cercamentos.\n• 1ª fase: carvão, máquina a vapor e indústria têxtil. 2ª fase (século XIX): aço, eletricidade e petróleo. 3ª fase (século XX): eletrônica, informática e automação.\n• Consequências: urbanização, burguesia industrial e proletariado, jornadas longas e trabalho infantil, formação do movimento operário e dos sindicatos." },
    { id: "b-his-2", subject: "História", title: "Linha do tempo do Brasil", text: "• 1500: chegada dos portugueses.\n• 1808: a família real portuguesa chega ao Rio de Janeiro.\n• 1822: Independência.\n• 1888: Lei Áurea, que abole a escravidão.\n• 1889: Proclamação da República.\n• 1930: início da Era Vargas.\n• 1964: golpe militar e início da ditadura.\n• 1985: fim do regime militar.\n• 1988: Constituição Federal em vigor." },
    { id: "b-int-1", subject: "Interioridade e projeto de vida", title: "Roteiro de reflexão do projeto de vida", text: "Modelo para pensar o seu projeto de vida.\n\n• Quem sou eu: valores, interesses e pontos fortes.\n• Onde quero chegar: objetivos para 1 ano, 5 anos e 10 anos.\n• Passos concretos: o que faço neste mês e nesta semana.\n• Obstáculos e apoios: o que pode atrapalhar e quem pode ajudar.\n• Revisão: o que mudou e o que ainda faz sentido.\n\nEscreva cada ponto com as suas palavras." },
    { id: "b-itn-1", subject: "Itinerário de ciências da natureza", title: "Modelo de resumo do itinerário", text: TPL("Itinerário de ciências da natureza") },
    { id: "b-ith-1", subject: "Itinerário de ciências humanas", title: "Modelo de resumo do itinerário", text: TPL("Itinerário de ciências humanas") },
    { id: "b-itl-1", subject: "Itinerário de linguagens", title: "Modelo de resumo do itinerário", text: TPL("Itinerário de linguagens") },
    { id: "b-ite-1", subject: "Itinerário de ciências exatas", title: "Modelo de resumo do itinerário", text: TPL("Itinerário de ciências exatas") },
    { id: "b-ing-1", subject: "Língua inglesa", title: "Tempos verbais básicos", text: "• Simple present: hábitos e verdades gerais. Na 3ª pessoa do singular, acrescenta -s (she works).\n• Present continuous: ação em andamento. am/is/are + verbo com -ing (I am studying).\n• Simple past: ação concluída. Verbos regulares terminam em -ed. Os irregulares precisam ser decorados (go, went).\n• Present perfect: have/has + particípio passado. Usado para experiências e ações que ainda importam hoje (I have visited Salvador).\n• Perguntas e negativas usam do/does (presente) e did (passado)." },
    { id: "b-lit-1", subject: "Literatura", title: "Escolas literárias no Brasil", text: "• Quinhentismo (século XVI): textos de informação e catequese.\n• Barroco (século XVII): contrastes e jogo de ideias. Gregório de Matos.\n• Arcadismo (século XVIII): vida simples no campo e equilíbrio.\n• Romantismo (marco em 1836): subjetividade, nacionalismo e idealização. José de Alencar e Gonçalves Dias.\n• Realismo (marco em 1881, com Memórias Póstumas de Brás Cubas): crítica social e análise psicológica. Machado de Assis.\n• Naturalismo: o meio e a biologia determinam o comportamento. Aluísio Azevedo.\n• Simbolismo (marco em 1893): musicalidade e subjetividade. Cruz e Sousa.\n• Modernismo (marco na Semana de 1922): liberdade formal e identidade brasileira." },
    { id: "b-por-1", subject: "Língua portuguesa", title: "Classes de palavras", text: "• Variáveis: substantivo, adjetivo, artigo, numeral, pronome e verbo.\n• Invariáveis: advérbio, preposição, conjunção e interjeição.\n• Substantivo nomeia seres. Adjetivo caracteriza o substantivo. Verbo indica ação, estado ou fenômeno.\n• Preposição liga termos. Conjunção liga orações ou termos de mesma função.\n• Dica: para identificar a classe, olhe a função da palavra na frase." },
    { id: "b-por-2", subject: "Língua portuguesa", title: "Orações coordenadas e subordinadas", text: "• Coordenadas: independentes entre si. Podem ser assindéticas (sem conjunção) ou sindéticas: aditiva, adversativa, alternativa, conclusiva e explicativa.\n• Subordinadas: dependem de outra oração.\n• Substantivas: exercem função de substantivo (sujeito, objeto, etc.).\n• Adjetivas: caracterizam um termo. Restritivas, sem vírgula, e explicativas, com vírgula.\n• Adverbiais: indicam circunstância, como causa, consequência, condição, concessão, tempo, finalidade, comparação, conformidade e proporção." },
    { id: "b-mat-1", subject: "Matemática", title: "Função do 2º grau", text: "• Forma: f(x) = ax² + bx + c, com a ≠ 0. O gráfico é uma parábola.\n• a > 0: concavidade para cima, com ponto de mínimo. a < 0: para baixo, com ponto de máximo.\n• Discriminante: Δ = b² − 4ac. Raízes: x = (−b ± √Δ) / 2a.\n• Δ > 0: duas raízes reais. Δ = 0: uma raiz. Δ < 0: nenhuma raiz real.\n• Vértice: xv = −b / 2a e yv = −Δ / 4a.\n• Soma das raízes: −b/a. Produto das raízes: c/a. A parábola corta o eixo y em (0, c)." },
    { id: "b-mat-2", subject: "Matemática", title: "Progressões aritmética e geométrica", text: "• PA (soma de uma razão r): aₙ = a₁ + (n − 1)·r. Soma: Sₙ = (a₁ + aₙ)·n / 2.\n• PG (multiplicação por uma razão q): aₙ = a₁·q^(n−1). Soma: Sₙ = a₁·(qⁿ − 1) / (q − 1).\n• Soma infinita da PG, quando |q| < 1: S = a₁ / (1 − q).\n• Em uma PA, cada termo é a média aritmética dos vizinhos. Em uma PG, o quadrado de cada termo é o produto dos vizinhos." },
    { id: "b-pro-1", subject: "Produção de texto", title: "Redação dissertativo-argumentativa", text: "• Introdução: apresenta o tema e a tese (seu ponto de vista).\n• Desenvolvimento: dois parágrafos, cada um com uma ideia, argumento e exemplo ou dado.\n• Conclusão: retoma a tese e traz a proposta de intervenção, com agente, ação, meio, finalidade e detalhamento.\n• Redação do Enem: 5 competências (norma culta, compreensão do tema e do tipo de texto, argumentação, coesão e proposta de intervenção que respeite os direitos humanos), com nota de 0 a 200 cada, somando até 1000.\n• Use conectivos entre parágrafos e releia procurando erros de ortografia e pontuação." },
    { id: "b-qui-1", subject: "Química", title: "Ligações químicas e tabela periódica", text: "• Iônica: transferência de elétrons entre metal e ametal.\n• Covalente: compartilhamento de pares de elétrons entre ametais.\n• Metálica: cátions imersos em um «mar» de elétrons livres.\n• Regra do octeto: os átomos tendem a ficar com 8 elétrons na camada de valência.\n• Eletronegatividade cresce para a direita e para cima na tabela. Raio atômico cresce para a esquerda e para baixo." },
    { id: "b-qui-2", subject: "Química", title: "Mol, soluções e pH", text: "• 1 mol = 6,02 × 10²³ entidades (constante de Avogadro).\n• Quantidade de matéria: n = m / M, com M em g/mol.\n• Concentração comum: C = m₁ / V (g/L). Molaridade: M = n / V (mol/L).\n• pH = −log[H⁺]. A 25 °C: pH < 7 é ácido, pH = 7 é neutro e pH > 7 é básico.\n• Cada unidade de pH muda a concentração de H⁺ por um fator de 10." },
    { id: "b-soc-1", subject: "Sociologia", title: "Os clássicos da Sociologia", text: "• Auguste Comte: criou o termo «sociologia» e defendeu o positivismo.\n• Émile Durkheim: fato social (maneiras de agir e pensar que vêm da sociedade e se impõem ao indivíduo). Solidariedade mecânica e orgânica.\n• Max Weber: ação social e compreensão do sentido que as pessoas dão ao que fazem. Dominação tradicional, carismática e legal-racional.\n• Karl Marx: modo de produção, luta de classes, trabalho e mais-valia." }
  ];

  function planBlocks(tasks, serie, prev) {
    var out = [], S = SERIES[serie] || null, titles = {}, k, done = {};

    if (S) for (k in S.titles) titles[k] = S.titles[k];

    var add = function (d, start, end, subj, title) {

      out.push({ id: uid(), day: d, start: start, end: end, subject: subj, title: title, taskId: t ? t.id : "", done: !!done[d + "|" + start + "|" + subj] });
    };
    PLAN.forEach(function (day, d) { day.forEach(function (subj, i) { add(d, SLOTS[i][0], SLOTS[i][1], subj, titles[subj] || "Revisão e tarefas"); }); });
    if (S) S.extra.forEach(function (x) { add(x.day, x.start, x.end, x.subject, x.title); });
    return out;

  /* ---------- Avisos ---------- */
  function computeAlerts() {
    var list = [], pend = 0, over = 0, soon = 0, missed = 0, d = dayIdx(), nm = nowMin();
    state.tasks.forEach(function (t) {
      if (t.status === "done") return;
      pend++;
      if (!t.due) return;
      var n = diffDays(t.due);
      if (n < 0) { over++; list.push({ sev: 0, cls: "crit", tag: "Atrasada", text: t.title + " (" + t.subject + "), venceu há " + (-n) + (n === -1 ? " dia" : " dias"), task: t.id }); }
      else if (n === 0) { soon++; list.push({ sev: 1, cls: "warn", tag: "Vence hoje", text: t.title + " (" + t.subject + ")", task: t.id }); }
      else if (n <= 2) { soon++; list.push({ sev: 2, cls: "warn", tag: "Em " + n + (n === 1 ? " dia" : " dias"), text: t.title + " (" + t.subject + ")", task: t.id }); }
    });
    state.blocks.forEach(function (b) {
      if (b.day !== d) return;
      if (toMin(b.start) <= nm && nm < toMin(b.end) && !b.done) list.push({ sev: 3, cls: "info", tag: "Agora", text: b.subject + ": " + b.title + ", até " + b.end, block: b.id });
      else if (toMin(b.end) <= nm && !b.done) { missed++; list.push({ sev: 3, cls: "warn", tag: "Sem registro", text: b.subject + " das " + b.start + " às " + b.end + ". Marque se você estudou.", block: b.id }); }
    });
    list.sort(function (a, b) { return a.sev - b.sev; });
    return { list: list, pend: pend, over: over, soon: soon, missed: missed };
  }

  /* ---------- Quadro ---------- */
  function taskCard(t) {
    var cls = "", pill = "";
    if (t.status !== "done" && t.due) {
      var n = diffDays(t.due);
      if (n < 0) { cls = "crit"; pill = '<span class="pill crit">Atrasada ' + (-n) + " d</span>"; }
      else if (n === 0) { cls = "warn"; pill = '<span class="pill warn">Vence hoje</span>'; }
      else if (n <= 2) { cls = "warn"; pill = '<span class="pill warn">Vence em ' + n + " d</span>"; }
    }
    if (t.status === "done") cls = "done";
    var idx = STATUS.map(function (s) { return s[0]; }).indexOf(t.status);
    return '<article class="card ' + cls + '" draggable="true" data-id="' + t.id + '">' +
      '<div class="meta">' + chip(t.subject) + pill + '<span class="pill plain">' + PRIO[t.prio] + "</span></div>" +

      (idx < 2 ? '<button class="btn small" data-action="move" data-id="' + t.id + '" data-to="' + STATUS[idx + 1][0] + '" aria-label="Mover para ' + STATUS[idx + 1][1] + '">→</button>' : "") +

  /* ---------- Resumos ---------- */
  function subjects() {

  function shelfList() {

  function renderSums() {
    state.read = state.read || {};
    var f = sumFilter, q = f.q.toLowerCase(), shelves = shelfList();
    var cnt = {}, vis = BANK.filter(function (b) { return serieAllows(sMin(b.id)); }), total = vis.length + state.summaries.length;

    var nav = '<button class="shelf' + (!f.subject ? " on" : "") + '" data-action="shelf" data-subject="" aria-pressed="' + !f.subject + '"><span class="dot" style="--h:200"></span><span class="nm">Todas as matérias</span><span class="ct">' + total + "</span></button>" +
      shelves.map(function (n) {

      }).join("");
    var items = [];
    if (f.origin !== "mine") BANK.forEach(function (b) { items.push({ kind: "bank", id: b.id, subject: b.subject, title: b.title, text: b.text, date: "" }); });
    if (f.origin !== "bank") state.summaries.forEach(function (x) { items.push({ kind: "mine", id: x.id, subject: x.subject, title: x.title, text: x.text, date: x.date, taskId: x.taskId }); });
    items = items.filter(function (it) {
      if (it.kind === "bank" && !serieAllows(sMin(it.id))) return false;

      (list.length ? '<div class="fc-grid">' + cards + "</div>" : '<div class="empty">' + empty + "</div>");

  function startStudy(ids) {
    var q = ids.slice().sort(function () { return Math.random() - .5; });
    q.sort(function (a, b) { var x = cardById(a), y = cardById(b); return (x.right - x.wrong) - (y.right - y.wrong); });
    study = { queue: q, i: 0, flipped: false, lock: false, right: 0, wrong: [], points: 0, streak: 0, best: 0, recorded: false, newRecord: false };
    renderStudy();
  }
  function closeStudy() {
    study = null; $("#study-root").innerHTML = ""; document.body.style.overflow = "";
    render();
  }
  function hudHtml(s, n) {
    return '<div class="hud"><div class="stat"><b id="st-points">' + s.points + '</b><span>Pontos</span></div><div class="stat"><b id="st-streak">' + s.streak + '</b><span>Sequência</span></div><div class="stat"><b id="st-right">' + s.right + '</b><span>Acertos</span></div>' +
      '<div class="grow"><span class="hint">Cartão ' + Math.min(s.i + 1, n) + " de " + n + '</span><button class="btn" data-action="study-exit">Sair</button></div></div>' +
      '<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="' + n + '" aria-valuenow="' + s.i + '"><i style="width:' + Math.round(100 * s.i / n) + '%"></i></div>';
  }
  function renderStudy() {
    var s = study, n = s.queue.length, root = $("#study-root");

      if (!s.recorded) {
        s.recorded = true;

      }
      var p = n ? s.right / n : 0, stars = p >= .9 ? 3 : p >= .6 ? 2 : 1, st = "";

    }
    var c = cardById(s.queue[s.i]);
    root.innerHTML = '<div class="arena"><div class="arena-in">' + hudHtml(s, n) +

  function flipCard() {

  function answerCard(ok) {
    if (!study || !study.flipped || study.lock) return;
    var c = cardById(study.queue[study.i]);
    study.lock = true;
    if (ok) {
      c.right++; study.right++; study.streak++; if (study.streak > study.best) study.best = study.streak;
      study.points += 10 + Math.min(study.streak - 1, 5) * 2;
    } else { c.wrong++; study.wrong.push(c.id); study.streak = 0; }
    save();
    $("#flip").classList.add(ok ? "hit" : "miss");
    $("#st-points").textContent = study.points; $("#st-streak").textContent = study.streak; $("#st-right").textContent = study.right;
    $("#b-no").disabled = true; $("#b-yes").disabled = true;

      ["Soma 7 e produto 6. A soma precisa ser 5.", "Correta. Soma 5 e produto 6.", "Soma −5. O sinal está trocado, pois a soma das raízes é −b/a = 5.", "Produto 30. O produto precisa ser 6.", "Soma −7 e produto 6. A soma precisa ser 5."]),
    Q("q-mat-02", "Matemática", "Função do 2º grau", "medio", "Qual é o vértice da parábola y = x² − 6x + 5?",
      ["(−3, −4)", "(6, 5)", "(3, 4)", "(3, −4)", "(−6, 5)"], 3,

    Q("q-mat-03", "Matemática", "Progressão aritmética", "medio", "Em uma PA, o primeiro termo é 3 e a razão é 4. Qual é a soma dos 10 primeiros termos?",

    Q("q-mat-04", "Matemática", "Porcentagem", "medio", "Um produto de R$ 200,00 sofre aumento de 20% e, em seguida, desconto de 20%. Qual é o preço final?",

    Q("q-mat-05", "Matemática", "Probabilidade", "facil", "Ao lançar um dado comum de 6 faces, qual é a probabilidade de sair um número maior que 4?",
      ["1/2", "1/6", "2/3", "1/3", "5/6"], 3,
      "Os resultados favoráveis são 5 e 6, ou seja, 2 em 6 possíveis. P = 2/6 = 1/3.",
      ["Inclui o 4, o que seria “maior ou igual a 4”.", "Considera só um resultado favorável.", "É a probabilidade de sair 4 ou menos.", "Correta.", "Seria a probabilidade de NÃO sair o 6."]),
    Q("q-por-01", "Língua portuguesa", "Classes de palavras", "medio", "Em “Ela chegou muito cedo”, as palavras “muito” e “cedo” classificam-se, respectivamente, como:",
      ["adjetivo e substantivo", "pronome indefinido e advérbio de tempo", "numeral e advérbio de lugar", "advérbio de modo e adjetivo", "advérbio de intensidade e advérbio de tempo"], 4,
      "“Cedo” indica o momento da chegada: advérbio de tempo. “Muito” intensifica “cedo” e não varia: advérbio de intensidade. Só seria pronome ou adjetivo se acompanhasse um substantivo (muitos alunos).",
      ["Adjetivo e substantivo variam em gênero e número. Aqui nenhuma das palavras varia.", "“Muito” não acompanha substantivo, então não é pronome indefinido.", "“Muito” não é numeral, e “cedo” não indica lugar.", "“Cedo” não é adjetivo, pois não caracteriza um substantivo.", "Correta."]),
    Q("q-por-02", "Língua portuguesa", "Concordância verbal", "medio", "Assinale a frase em que a concordância verbal está de acordo com a norma-padrão.",
      ["Fazem dois anos que moro aqui.", "Houveram muitos problemas na reunião.", "Haviam muitos alunos na sala.", "Faz dois anos que moro aqui.", "Devem haver soluções para esse problema."], 3,
      "O verbo fazer, indicando tempo decorrido, é impessoal e fica na 3ª pessoa do singular. Haver, no sentido de existir, também é impessoal: houve, havia, deve haver.",

    Q("q-lit-01", "Literatura", "Escolas literárias", "facil", "A publicação de Memórias Póstumas de Brás Cubas, de Machado de Assis, em 1881, é considerada o marco inicial de qual escola literária no Brasil?",

    Q("q-fis-01", "Física", "Leis de Newton", "facil", "Um corpo de massa 4 kg sofre a ação de uma força resultante de 20 N. Qual é a aceleração que ele adquire?",

    Q("q-fis-02", "Física", "Eletricidade", "medio", "Um resistor de 10 Ω é percorrido por uma corrente de 2 A. Quais são a tensão entre seus terminais e a potência dissipada?",

    Q("q-fis-03", "Física", "Cinemática", "medio", "Um carro parte do repouso com aceleração constante de 2 m/s². Após 5 s, qual é a sua velocidade e qual a distância percorrida nesse intervalo?",

      ["A velocidade está certa, mas 50 m é a · t² sem dividir por 2.", "A velocidade correta é a · t = 10 m/s.", "Correta.", "Trocou as duas grandezas.", "A velocidade está certa, mas a distância não é 10 m."]),
    Q("q-qui-01", "Química", "Ligações químicas", "facil", "O cloreto de sódio (NaCl), o sal de cozinha, é formado por qual tipo de ligação química?",

    Q("q-qui-02", "Química", "Mol e massa molar", "medio", "Quantos mols de moléculas há em 36 g de água (H₂O)? Dados: H = 1 g/mol e O = 16 g/mol.",

    Q("q-qui-03", "Química", "pH e acidez", "medio", "Uma solução aquosa a 25 °C tem concentração de íons H⁺ igual a 10⁻³ mol/L. Qual é o seu pH e o seu caráter?",

    Q("q-bio-01", "Biologia", "Citologia", "facil", "Qual organela é a principal responsável pela produção de ATP na respiração celular?",

    Q("q-bio-02", "Biologia", "Genética", "medio", "Do cruzamento entre dois indivíduos heterozigotos (Aa × Aa), qual é a probabilidade de nascer um descendente com genótipo aa?",

    Q("q-bio-03", "Biologia", "Ecologia", "facil", "Em uma cadeia alimentar, os produtores são os organismos que:",

    Q("q-his-01", "História", "Revolução Industrial", "facil", "A Revolução Industrial teve início em qual país e em qual século?",

    Q("q-geo-01", "Geografia", "Biomas brasileiros", "facil", "Qual bioma brasileiro é marcado por clima semiárido e vegetação adaptada à seca?",

    Q("q-geo-02", "Geografia", "População e urbanização", "facil", "O deslocamento de população do campo para a cidade, intensificado no Brasil a partir da segunda metade do século XX, é chamado de:",

    Q("q-fil-01", "Filosofia", "Filosofia antiga", "facil", "O método de Sócrates, que usa perguntas para levar o interlocutor a refletir e a “dar à luz” as próprias ideias, é conhecido como:",

    Q("q-soc-01", "Sociologia", "Clássicos da Sociologia", "medio", "Para o sociólogo Émile Durkheim, “fato social” é:",
      ["qualquer ação realizada por um indivíduo isolado", "uma opinião pessoal sem influência coletiva", "uma maneira de agir, pensar e sentir exterior ao indivíduo, que exerce sobre ele uma força de coerção", "apenas aquilo que está previsto em lei", "um fenômeno natural, sem relação com a sociedade"], 2,
      "Para Durkheim, fatos sociais são exteriores aos indivíduos, são gerais na sociedade e exercem coerção sobre eles. Exemplos: costumes, regras morais e religiosas.",

    Q("q-ing-01", "Língua inglesa", "Simple present", "facil", "Choose the correct option: “She ___ to school every day.”",

    Q("q-art-01", "Artes", "Movimentos artísticos", "facil", "Qual movimento artístico, associado a Pablo Picasso e Georges Braque, representa os objetos por vários ângulos ao mesmo tempo, com formas geométricas?",

  /* ===== Estado extra ===== */
  function ensureState(s) {
    s.tasks = s.tasks || []; s.blocks = s.blocks || [];
    s.summaries = s.summaries || []; s.cards = s.cards || []; s.read = s.read || {};
    s.questions = s.questions || []; s.log = s.log || []; s.flags = s.flags || {}; s.sims = s.sims || [];
    s.focus = s.focus || []; delete s.groups; s.provas = s.provas || []; s.exams = s.exams || []; s.profile = s.profile || null;
    s.focusCfg = s.focusCfg || { focus: 25, short: 5, long: 15, every: 4, subject: "", strict: false };
    return s;
  }
  var BASE_TITLE = "Pauta de Estudos";
  function allQ() { return QUESTIONS.concat(state.questions); }
  function qById(id) { var l = allQ(); for (var i = 0; i < l.length; i++) if (l[i].id === id) return l[i]; return null; }
  function lastAttempt(qid) { for (var i = state.log.length - 1; i >= 0; i--) if (state.log[i].qid === qid) return state.log[i]; return null; }
  function qStatus(qid) { var a = lastAttempt(qid); return !a ? "pend" : a.ok ? "ok" : "err"; }
  function getFlag(qid) { return state.flags[qid] || {}; }
  function setFlag(qid, patch) { var f = state.flags[qid] || (state.flags[qid] = {}); for (var k in patch) f[k] = patch[k]; save(); }
  function logAttempt(qid, choice, secs, mode, simId) {
    var q = qById(qid); if (!q) return;
    state.log.push({ qid: qid, ts: Date.now(), choice: choice, ok: choice === q.ok, secs: Math.round(secs || 0), mode: mode, sim: simId || "" });
  }
  function shuffle(arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function uniq(arr) { var o = {}, r = []; arr.forEach(function (x) { if (x !== "" && x != null && !o[x]) { o[x] = 1; r.push(x); } }); return r; }
  function mmss(sec) { sec = Math.max(0, Math.round(sec)); var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return (h ? h + ":" + pad(m) : m) + ":" + pad(s); }
  function minsFmt(sec) { if (sec > 0 && sec < 60) return Math.round(sec) + " s"; var m = Math.round(sec / 60); return m < 60 ? m + " min" : Math.floor(m / 60) + " h " + pad(m % 60) + " min"; }
  function pctNum(a, b) { return b ? Math.round(100 * a / b) : 0; }
  function opts(list, sel, allLabel) {
    return (allLabel ? '<option value="">' + allLabel + "</option>" : "") + list.map(function (x) {
      var v = Array.isArray(x) ? x[0] : x, l = Array.isArray(x) ? x[1] : x;
      return '<option value="' + esc(v) + '"' + (String(v) === String(sel) ? " selected" : "") + ">" + esc(l) + "</option>";
    }).join("");
  }
  function syncScroll() {
    var any = ["#study-root", "#q-root", "#sim-root", "#focus-root", "#login-root"].some(function (s) { return $(s).children.length; });
    document.body.style.overflow = any ? "hidden" : "";
  }
  function levelPill(l) { return '<span class="pill ' + (l === "facil" ? "ok" : l === "medio" ? "warn" : "crit") + '">' + LEVELS[l] + "</span>"; }
  function instLabel(q) { return q.inst + (q.year ? " " + q.year : ""); }
  function statusPill(qid) {
    var s = qStatus(qid);
    return s === "ok" ? '<span class="pill ok">Resolvida</span>' : s === "err" ? '<span class="pill crit">Errou</span>' : '<span class="pill plain">Pendente</span>';
  }

  /* ===== Gráficos simples ===== */
  function lineChart(points, label) {
    var W = 640, H = 230, L = 38, R = 16, T = 22, B = 34, iw = W - L - R, ih = H - T - B;
    var n = points.length, s = '<svg class="lc" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(label) + '">';
    [0, 25, 50, 75, 100].forEach(function (g) {
      var y = T + ih - ih * g / 100;
      s += '<line class="lc-grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '"/><text class="lc-t" x="' + (L - 6) + '" y="' + (y + 4) + '" text-anchor="end">' + g + "%</text>";
    });
    var xs = points.map(function (p, i) { return n === 1 ? L + iw / 2 : L + iw * i / (n - 1); });
    var ys = points.map(function (p) { return T + ih - ih * p.value / 100; });
    if (n > 1) s += '<polyline class="lc-line" points="' + xs.map(function (x, i) { return x + "," + ys[i]; }).join(" ") + '"/>';

      case "run-exit": if (!run.exit) { run.exit = true; renderRun(); } else closeSim(); return true;
      case "perf-train": {
        var pool = allQ().filter(function (q) { return q.subject === el.dataset.subject && q.topic === el.dataset.topic; });
        if (pool.length) beginRun({ name: "Treino: " + el.dataset.topic, kind: "assunto", qids: pickQ(pool, 5, true), limit: 0 });
        return true;
      }
      case "po-toggle": if (pomo.running) pomoPause(); else pomoStart(); if (tab === "foco") renderFocus(); return true;
      case "po-reset": pomoSet(pomo.phase); pomo.msg = ""; closeFocusOverlay(); renderFocus(); return true;
      case "po-skip": { var nx = pomo.phase === "focus" ? "short" : "focus"; pomoSet(nx); pomo.msg = "Fase pulada. Nenhuma sessão foi registrada."; closeFocusOverlay(); renderFocus(); return true; }
      case "po-abandon": if (!pomo.abandon) { pomo.abandon = true; var b = $("[data-action='po-abandon']"); if (b) b.textContent = "Confirmar abandono (não registra)"; } else { pomo.abandon = false; pomoSet("focus"); pomo.msg = "Sessão abandonada. Nada foi registrado."; closeFocusOverlay(); if (tab === "foco") renderFocus(); } return true;
      case "sim-tab": simTab = el.dataset.v; renderSims(); return true;
      case "pf-start": startProva(); return true;
      case "pr-pick": { var pi = +el.dataset.i, pk = +el.dataset.k; if (pr.answers[pi] === pk) delete pr.answers[pi]; else pr.answers[pi] = pk; updProvaRow(pi, pk); return true; }
      case "pr-mark": { var mi = +el.dataset.i; pr.marked[mi] = !pr.marked[mi]; updProvaRow(mi, -1); var mb = $("#pr-row-" + mi + " .pmk"); if (mb) mb.focus(); return true; }
      case "pr-finish": if (!pr.confirm) { pr.confirm = true; $("#pr-finish").textContent = prFinishLabel(); } else finishProva(false); return true;
      case "pr-exit": if (!pr.exit) { pr.exit = true; $("#pr-exit").textContent = "Confirmar: sair sem salvar"; } else closeSim(); return true;
      case "pv-view": { var pv = provaById(id); if (pv) renderProvaResult(pv); return true; }
      case "pv-edit": { var pe = provaById(id); if (pe) renderProvaResult(pe, true); return true; }
      case "pv-apply": {
        var pa = provaById(id), g = parseGab($("#pv-gab").value, pa.n, pa.alts);
        if (g.error || !g.gab) { $("#pv-msg").textContent = g.error || "Cole o gabarito completo."; return true; }
        pa.gab = g.gab; gradeProva(pa); save(); render(); renderProvaResult(pa); return true;
      }
      case "pv-close": closeSim(); return true;
      case "pv-again": { var pg = provaById(id); if (pg) { var ex = examById(pg.examId); pf.exam = ex.id; pf.part = Math.max(0, ex.parts.map(function (x) { return x[0]; }).indexOf(pg.part)); pf.year = pg.year; pf.n = pg.n; pf.alts = pg.alts; pf.areas = pg.areas.length === 1 && pg.areas[0].name === "Geral" ? "" : pg.areas.map(function (x) { return x.name + ":" + x.from + "-" + x.to; }).join(", "); pf.limit = Math.round(pg.limit / 60); pf.gab = pg.gab; simTab = "provas"; renderSims(); window.scrollTo(0, 0); } return true; }
      case "pv-del": { var pd = provaById(id); if (pd) openModal("Excluir prova", "<p>Excluir o registro de " + esc(provaName(pd)) + " apaga as respostas e o resultado deste navegador.</p>", { saveLabel: "Excluir", onSave: function () { state.provas = state.provas.filter(function (x) { return x.id !== id; }); commit(); } }); return true; }
      case "ex-add": exForm(); return true;
      case "ex-del": { state.exams = state.exams.filter(function (x) { return x.id !== id; }); if (pf.exam === id) { pf.exam = "enem"; applyPart(EXAMS[0], 0); } save(); renderSims(); return true; }
      case "profile": renderLogin(true); return true;
      case "lg-enter": doLogin(); return true;
      case "lg-cancel": closeLogin(); return true;
    }
    return false;
  }
  function extChange(e) {
    var el = e.target, id = el.id || "";
    if (id === "q-serie" || id === "sum-serie" || id === "sf-serie") { state.profile.onlySerie = el.checked; save(); render(); return true; }
    if (id.indexOf("pf-") === 0) {
      if (id === "pf-exam") { var py = $("#pf-year") ? $("#pf-year").value : pf.year, pg2 = $("#pf-gab") ? $("#pf-gab").value : pf.gab; pf.exam = el.value; applyPart(examById(pf.exam), 0); pf.year = py; pf.gab = pg2; renderSims(); }
      else if (id === "pf-part") { var py2 = $("#pf-year").value, pg3 = $("#pf-gab").value; applyPart(examById(pf.exam), +el.value); pf.year = py2; pf.gab = pg3; renderSims(); }
      else readPf();
      return true;
    }
    if (id.indexOf("q-f-") === 0) { var k = id.slice(4); qf[k] = el.value; if (k === "subject") qf.topic = ""; renderQuestions(); return true; }
    if (el.dataset && el.dataset.action === "q-save-flag") { setFlag(qv.id, { saved: el.checked }); return true; }
    if (id === "sf-type") { sf.type = el.value; var len = poolFor(sf).length; sf.n = (sf.type === "completo" || sf.type === "prova") ? len : Math.min(10, len); renderSims(); return true; }
    if (id === "sf-subject") { sf.subject = el.value; sf.topic = ""; normSf(); sf.n = Math.min(10, poolFor(sf).length); renderSims(); return true; }
    if (id === "sf-topic") { sf.topic = el.value; sf.n = Math.min(10, poolFor(sf).length); renderSims(); return true; }
    if (id === "sf-prova") { sf.prova = el.value; sf.n = poolFor(sf).length; renderSims(); return true; }
    if (id === "sf-prefer") { sf.prefer = el.checked; return true; }
    if (el.name === "sf-mode") { sf.mode = el.value; renderSims(); return true; }
    if (id === "sf-n" || id === "sf-per") { if (id === "sf-n") sf.n = +el.value || 1; else sf.per = Math.max(1, Math.min(30, +el.value || 1)); normSf(); var t = $("#sim-total"); if (t) t.textContent = simTotalText(); return true; }
    if (id.indexOf("po-") === 0 && el.tagName !== "BUTTON") {
      var c = state.focusCfg;
      if (id === "po-subject") c.subject = el.value; else if (id === "po-strict") c.strict = el.checked;
      else { var v = Math.max(1, Math.min(+el.max, Math.round(+el.value) || 1)); if (id === "po-focus") c.focus = v; else if (id === "po-short") c.short = v; else if (id === "po-long") c.long = v; else if (id === "po-every") c.every = v; }
      save(); if (!pomo.running) { pomo.total = pomo.left = phaseSecs(pomo.phase); } renderFocus(); return true;
    }
    return false;
  }
  function extInput(e) {
    var id = e.target.id || "";
    if (id === "sf-n" || id === "sf-per") {
      if (id === "sf-n") sf.n = +e.target.value || 1; else sf.per = Math.max(1, Math.min(30, +e.target.value || 1));
      var d = normSf(); var t = $("#sim-total"); if (t) t.textContent = simTotalText(); return true;
    }
    return false;
  }
  document.addEventListener("keydown", function (e) {
    if ($("#modal-root").children.length) return;
    var tg = e.target && e.target.tagName;
    if (qv) {
      if (e.key === "Escape") return closeQV();
      if (tg === "TEXTAREA" || tg === "INPUT" || tg === "SELECT") return;
      var li = "abcde".indexOf(e.key.toLowerCase());
      if (li >= 0 && e.key.length === 1 && !qv.answered) { qv.choice = li; renderQV(); }
      else if (e.key === "Enter" && !qv.answered && qv.choice != null) answerQ();
    }
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Enter" && e.target && e.target.id === "lg-name") { e.preventDefault(); doLogin(); } });
  window.addEventListener("beforeunload", function (e) { if (run || pr) { e.preventDefault(); e.returnValue = ""; } });

  /* ---------- Eventos ---------- */
  document.addEventListener("click", function (e) {
    var tabBtn = e.target.closest("[data-tab]");
    if (tabBtn) return setTab(tabBtn.dataset.tab, true);
    var el = e.target.closest("[data-action]");
    if (!el || el.dataset.action === "overlay") return;
    var id = el.dataset.id, a = el.dataset.action;
    if (extClick(a, el, id)) return;
    if (a === "new-task") taskForm();
    else if (a === "edit-task") taskForm(taskById(id));
    else if (a === "move") { var t = taskById(id); t.status = el.dataset.to; save(); render(); }
    else if (a === "new-block") blockForm(null, +el.dataset.day);
    else if (a === "edit-block") blockForm(state.blocks.filter(function (b) { return b.id === id; })[0]);
    else if (a === "new-sum") sumForm();
    else if (a === "edit-sum") sumForm(state.summaries.filter(function (s) { return s.id === id; })[0]);
    else if (a === "shelf") { sumFilter.subject = el.dataset.subject; renderSums(); }
    else if (a === "origin") { sumFilter.origin = el.dataset.v; renderSums(); }
    else if (a === "save-copy") {
      var bk = BANK.filter(function (b) { return b.id === id; })[0];
      if (bk) { state.summaries.push({ id: uid(), title: bk.title, subject: bk.subject, date: today(), taskId: "", text: bk.text }); sumFilter.copied[id] = true; save(); render(); }
    }
    else if (a === "toggle-sum") { sumFilter.open[id] = !sumFilter.open[id]; renderSums(); }
    else if (a === "toggle-alerts") { showAllAlerts = !showAllAlerts; renderAlerts(); }
    else if (a === "goto-block") { setTab("cronograma", true); var n = document.getElementById("block-" + id); if (n) n.scrollIntoView({ block: "center" }); }
    else if (a === "new-card") cardForm();
    else if (a === "edit-card") cardForm(cardById(id));
    else if (a === "study-start") { var ids = cardsFiltered().map(function (c) { return c.id; }); if (ids.length) startStudy(ids); }
    else if (a === "study-wrong") startStudy(study.wrong.slice());
    else if (a === "study-restart") startStudy(cardsFiltered().map(function (c) { return c.id; }));
    else if (a === "study-exit") closeStudy();
    else if (a === "flip") flipCard();
    else if (a === "answer") answerCard(el.dataset.ok === "1");
    else if (a === "load-plan") planForm();
    else if (a === "backup") backupForm();
    else if (a === "reset") resetForm();
  });
  document.addEventListener("change", function (e) {
    var el = e.target;
    if (extChange(e)) return;
    if (el.dataset && el.dataset.action === "toggle-block") {
      var b = state.blocks.filter(function (x) { return x.id === el.dataset.id; })[0];
      b.done = el.checked; save(); render();
    } else if (el.dataset && el.dataset.action === "toggle-read") {
      state.read = state.read || {};
      if (el.checked) state.read[el.dataset.id] = true; else delete state.read[el.dataset.id];
      save(); renderSums();
    } else if (el.id === "sum-subject") { sumFilter.subject = el.value; renderSums(); }
    else if (el.id === "fc-subject") { cardFilter = el.value; renderCards(); }
  });
  document.addEventListener("input", function (e) {
    if (extInput(e)) return;
    if (e.target.id === "sum-q") {
      sumFilter.q = e.target.value; var pos = e.target.selectionStart; renderSums();
      var q = $("#sum-q"); q.focus(); try { q.setSelectionRange(pos, pos); } catch (x) {}
    }
  });

  /* Arrastar e soltar no quadro */
  var dragId = null;
  document.addEventListener("dragstart", function (e) {
    var c = e.target.closest && e.target.closest(".card[data-id]");
    if (!c) return; dragId = c.dataset.id;
    try { e.dataTransfer.setData("text/plain", dragId); e.dataTransfer.effectAllowed = "move"; } catch (x) {}
  });
  document.addEventListener("dragover", function (e) {
    var col = e.target.closest && e.target.closest(".col");
    if (col && dragId) { e.preventDefault(); document.querySelectorAll(".col.over").forEach(function (c) { if (c !== col) c.classList.remove("over"); }); col.classList.add("over"); }
  });
  document.addEventListener("drop", function (e) {
    var col = e.target.closest && e.target.closest(".col");
    if (col && dragId) { e.preventDefault(); var t = taskById(dragId); if (t) { t.status = col.dataset.status; save(); } }
    dragId = null; render();
  });
  document.addEventListener("dragend", function () { dragId = null; document.querySelectorAll(".col.over").forEach(function (c) { c.classList.remove("over"); }); });

  document.addEventListener("keydown", function (e) {
    if (!study || $("#modal-root").children.length) return;
    if (e.key === "Escape") return closeStudy();
    if (study.i < study.queue.length && study.flipped) {
      if (e.key === "ArrowLeft") answerCard(false);
      else if (e.key === "ArrowRight") answerCard(true);
    }
  });

  function fromHash() { var h = (location.hash || "").replace("#", ""); if (TABS.indexOf(h) >= 0) tab = h; }
  window.addEventListener("hashchange", function () { fromHash(); render(); });

  state = load();
  fromHash();
  render();
  setInterval(function () { if (!$("#modal-root").children.length) renderAlerts(); }, 60000);
})();
</script>
</body>
</html>
